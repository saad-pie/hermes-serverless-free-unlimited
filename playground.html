<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Antigravity // Playground</title>
  <meta name="description" content="Test any of the 200+ zero-cost flagship models in the Antigravity API playground.">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            mono: ['"JetBrains Mono"', 'Consolas', 'monospace']
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { font-family: 'JetBrains Mono', monospace; background-color: #000000; color: #f4f4f5; }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: #000; }
    ::-webkit-scrollbar-thumb { background: #27272a; }
  </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-emerald-500 selection:text-black">

  <!-- Navigation -->
  <header class="border-b border-zinc-900 bg-black/90 sticky top-0 z-50 backdrop-blur">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
      <a href="index.html" class="font-extrabold text-xs sm:text-sm tracking-widest text-emerald-400 flex items-center space-x-2">
        <span class="w-2.5 h-2.5 bg-emerald-500 rounded-full animate-pulse"></span>
        <span>ANTIGRAVITY_ROUTER</span>
      </a>
      <!-- Desktop Nav -->
      <nav class="hidden md:flex items-center space-x-6 text-xs">
        <a href="index.html" class="text-zinc-500 hover:text-emerald-400 transition">INDEX</a>
        <a href="models.html" class="text-zinc-500 hover:text-emerald-400 transition">MODELS (200+)</a>
        <a href="playground.html" class="text-emerald-400 font-bold border-b border-emerald-500 pb-0.5">PLAYGROUND</a>
        <a href="docs.html" class="text-zinc-500 hover:text-emerald-400 transition">DOCS</a>
      </nav>
      <!-- Mobile Hamburger Button -->
      <button onclick="toggleMobileMenu()" class="md:hidden text-zinc-400 hover:text-emerald-400 p-2 text-base focus:outline-none">
        <i class="fa-solid fa-bars" id="menu-icon"></i>
      </button>
    </div>
    <!-- Mobile Menu Dropdown -->
    <div id="mobile-menu" class="hidden md:hidden border-b border-zinc-900 bg-black px-6 py-4 space-y-3 text-xs">
      <a href="index.html" class="block text-zinc-400 hover:text-emerald-400 py-1">INDEX</a>
      <a href="models.html" class="block text-zinc-400 hover:text-emerald-400 py-1">MODELS (200+)</a>
      <a href="playground.html" class="block text-emerald-400 font-bold py-1">PLAYGROUND</a>
      <a href="docs.html" class="block text-zinc-400 hover:text-emerald-400 py-1">DOCS</a>
    </div>
  </header>

  <!-- Playground Main -->
  <main class="flex-1 max-w-6xl w-full mx-auto px-4 sm:px-6 py-8 sm:py-12 flex flex-col space-y-6">
    <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
      <div>
        <h1 class="text-2xl font-extrabold uppercase tracking-tight text-zinc-100">API Playground</h1>
        <p class="text-xs text-zinc-500">Test prompts across any flagship model.</p>
      </div>
      <div class="w-full sm:w-72">
        <label class="block text-[10px] text-zinc-500 uppercase mb-1">Select Model</label>
        <select id="model-select" class="w-full bg-black border border-zinc-800 text-xs text-emerald-400 p-2.5 focus:outline-none focus:border-emerald-500">
          <option value="Atria-Dawn-Preview">Atria-Dawn-Preview (Flagship 100M)</option>
          <option value="gemini-3.6-flash">gemini-3.6-flash</option>
          <option value="gemma-4-26b:free">gemma-4-26b:free</option>
          <option value="deepseek-r1-distill-qwen-32b:free">deepseek-r1-distill-qwen-32b:free</option>
          <option value="nemotron-3-ultra-550b-a55b:free">nemotron-3-ultra-550b-a55b:free</option>
        </select>
      </div>
    </div>

    <!-- Chat Box -->
    <div class="border border-zinc-900 bg-black flex-1 flex flex-col min-h-[450px] p-4 sm:p-6 space-y-4">
      <div id="chat-messages" class="flex-1 overflow-y-auto space-y-4 pr-2 text-xs">
        <div class="bg-zinc-950 p-4 border border-zinc-900 text-zinc-300">
          <span class="text-[10px] text-emerald-400 font-bold block mb-1">ANTIGRAVITY SYSTEM</span>
          Welcome to the Antigravity Playground. Type your prompt below to test any active free model instantly.
        </div>
      </div>

      <!-- Input Area -->
      <div class="border-t border-zinc-900 pt-4 flex gap-2">
        <textarea id="chat-input" rows="2" placeholder="Send a message..." class="flex-1 bg-black border border-zinc-800 p-3 text-xs text-zinc-200 focus:outline-none focus:border-emerald-500 resize-none" onkeydown="if(event.key==='Enter' && !event.shiftKey){event.preventDefault();sendMessage();}"></textarea>
        <button onclick="sendMessage()" class="px-5 bg-emerald-500 text-black font-bold text-xs uppercase hover:bg-emerald-400 transition flex items-center justify-center">
          <i class="fa-solid fa-paper-plane"></i>
        </button>
      </div>
    </div>
  </main>

  <footer class="border-t border-zinc-900 bg-black py-6 text-center text-[10px] text-zinc-700 uppercase tracking-widest mt-auto">
    ANTIGRAVITY // PLAYGROUND
  </footer>

  <script>
    function toggleMobileMenu() {
      const menu = document.getElementById('mobile-menu');
      const icon = document.getElementById('menu-icon');
      if (menu.classList.contains('hidden')) {
        menu.classList.remove('hidden');
        icon.className = 'fa-solid fa-xmark text-emerald-400';
      } else {
        menu.classList.add('hidden');
        icon.className = 'fa-solid fa-bars';
      }
    }

    async function sendMessage() {
      const input = document.getElementById('chat-input');
      const text = input.value.trim();
      const model = document.getElementById('model-select').value;
      if (!text) return;

      const chatMessages = document.getElementById('chat-messages');
      chatMessages.innerHTML += `
        <div class="bg-zinc-900/50 p-4 border border-zinc-800 text-zinc-200 ml-8">
          <span class="text-[10px] text-zinc-500 font-bold block mb-1">YOU</span>
          ${escapeHtml(text)}
        </div>
      `;
      input.value = '';
      chatMessages.scrollTop = chatMessages.scrollHeight;

      const loadingId = 'msg-' + Date.now();
      chatMessages.innerHTML += `
        <div id="${loadingId}" class="bg-zinc-950 p-4 border border-zinc-900 text-zinc-400 mr-8 animate-pulse">
          <span class="text-[10px] text-emerald-400 font-bold block mb-1">${model}</span>
          Generating response...
        </div>
      `;
      chatMessages.scrollTop = chatMessages.scrollHeight;

      try {
        const res = await fetch('/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer antigravity-free'
          },
          body: JSON.stringify({
            model: model,
            messages: [{ role: 'user', content: text }]
          })
        });
        const data = await res.json();
        const reply = data.choices && data.choices[0] && data.choices[0].message ? data.choices[0].message.content : JSON.stringify(data);
        
        document.getElementById(loadingId).outerHTML = `
          <div class="bg-zinc-950 p-4 border border-zinc-900 text-zinc-300 mr-8">
            <span class="text-[10px] text-emerald-400 font-bold block mb-1">${model}</span>
            ${escapeHtml(reply)}
          </div>
        `;
      } catch (e) {
        document.getElementById(loadingId).outerHTML = `
          <div class="bg-zinc-950 p-4 border border-red-900 text-red-400 mr-8">
            <span class="text-[10px] text-red-500 font-bold block mb-1">ERROR</span>
            Failed to connect: ${e.message}
          </div>
        `;
      }
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function escapeHtml(str) {
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
  </script>
</body>
</html>
